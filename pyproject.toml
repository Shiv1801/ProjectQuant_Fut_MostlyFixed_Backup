[project]
name = "project-trade"
version = "0.2.0"
description = "Long-premium option-buying algobot for Nifty/BankNifty/FinNifty"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
